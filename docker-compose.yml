# Local infrastructure for the ReachInbox scheduler.
# Host ports are offset (5434 / 6380) so they don't collide with a locally installed Postgres/Redis.
name: reachinbox

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ri
      POSTGRES_PASSWORD: ri
      POSTGRES_DB: reachinbox
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ri -d reachinbox"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # AOF persistence: delayed BullMQ jobs survive a Redis/container restart (see GODFATHER §5.5).
    # noeviction is required by BullMQ — Redis must never silently drop job keys.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  redisdata:
  esdata:
